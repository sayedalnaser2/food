<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NutriPlan – Diet meal planner with recipes</title>
<meta name="description" content="Calculate your daily calories, carbs, protein and fat, then get a 7-day meal plan with a full recipe for every meal.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#" data-i18n-html="brand"></a>
  <nav><a href="#calc" data-i18n="nav_calc"></a> <a href="#pantry" data-i18n="nav_pantry"></a> <a href="#plan" data-i18n="nav_plan"></a> <a href="#recipes" data-i18n="nav_recipes"></a>
    <button type="button" id="lang" class="langbtn" data-i18n="lang_btn" lang="ar"></button></nav>
</header>

<section class="hero">
  <h1 data-i18n-html="hero_h1"></h1>
  <p data-i18n="hero_p"></p>
</section>

<main>
<section id="calc" class="card">
  <h2 data-i18n="h_numbers"></h2>
  <form id="form" autocomplete="off">
    <div class="grid">
      <label><span data-i18n="units"></span>
        <select id="units"><option value="metric" data-i18n="metric"></option><option value="imperial" data-i18n="imperial"></option></select></label>
      <label><span data-i18n="sex"></span>
        <select id="sex"><option value="f" data-i18n="female"></option><option value="m" data-i18n="male"></option></select></label>
      <label><span data-i18n="age"></span> <input id="age" type="number" min="15" max="90" value="30" required></label>
      <label><span id="hlabel"></span> <input id="height" type="number" step="0.1" value="170" required></label>
      <label><span id="wlabel"></span> <input id="weight" type="number" step="0.1" value="75" required></label>
      <label><span data-i18n="activity"></span>
        <select id="activity">
          <option value="1.2" data-i18n="act1"></option>
          <option value="1.375" data-i18n="act2" selected></option>
          <option value="1.55" data-i18n="act3"></option>
          <option value="1.725" data-i18n="act4"></option>
          <option value="1.9" data-i18n="act5"></option>
        </select></label>
      <label><span data-i18n="goal"></span>
        <select id="goal">
          <option value="lose" data-i18n="goal_lose"></option>
          <option value="maintain" data-i18n="goal_maintain"></option>
          <option value="gain" data-i18n="goal_gain"></option>
        </select></label>
      <label><span data-i18n="diet"></span>
        <select id="diet"><option value="any" data-i18n="diet_any"></option><option value="veg" data-i18n="diet_veg"></option><option value="vegan" data-i18n="diet_vegan"></option></select></label>
      <label><span data-i18n="cuisine"></span>
        <select id="cuisine"></select></label>
      <label><span data-i18n="snacks"></span>
        <select id="snacks"><option value="0" data-i18n="snacks_none"></option><option value="1" selected>1</option><option value="2">2</option></select></label>
    </div>
    <div class="btns"><button class="primary" type="submit" data-i18n="btn_calc"></button>
      <button class="secondary" type="button" id="custom" data-i18n="btn_custom"></button></div>
  </form>
</section>

<section id="pantry" class="card">
  <h2 data-i18n="pantry_h"></h2>
  <p class="muted" data-i18n="pantry_p"></p>
  <div id="pantrygroups"></div>
  <div class="rowhead">
    <label class="check"><input type="checkbox" id="usepantry"> <span data-i18n="use_pantry"></span></label>
    <button type="button" id="clearpantry" class="ghost" data-i18n="clear_all"></button>
  </div>
  <h3><span data-i18n="pantry_recipes"></span> <span id="pcount" class="muted"></span></h3>
  <div class="filters">
    <select id="pmeal"><option value="" data-i18n="all_meals"></option><option value="breakfast" data-i18n="breakfast"></option><option value="lunch" data-i18n="lunch"></option><option value="dinner" data-i18n="dinner"></option><option value="snack" data-i18n="snack"></option></select>
    <select id="pdiet"><option value="any" data-i18n="any_diet"></option><option value="veg" data-i18n="diet_veg"></option><option value="vegan" data-i18n="diet_vegan"></option></select>
    <label class="check"><input type="checkbox" id="pall" checked> <span data-i18n="only_ok"></span></label>
  </div>
  <div id="plist" class="rlist"></div>
  <div id="pmore" class="morerow"></div>
</section>

<section id="results" hidden>
  <div class="card">
    <h2 data-i18n="targets_h"></h2>
    <p class="muted" data-i18n="targets_p"></p>
    <div class="targets">
      <div class="donut" id="donut"><div><b id="tkcal"></b><small id="tkunit"></small></div></div>
      <div class="macros">
        <label class="macro"><i class="dot k"></i><span data-i18n="calories"></span><input id="gk" type="number" min="800" max="6000" step="10"><small data-i18n="kcal"></small></label>
        <label class="macro"><i class="dot c"></i><span data-i18n="carbs"></span><input id="gc" type="number" min="0" max="900" step="5"><small data-i18n="g"></small></label>
        <label class="macro"><i class="dot p"></i><span data-i18n="protein"></span><input id="gp" type="number" min="0" max="500" step="5"><small data-i18n="g"></small></label>
        <label class="macro"><i class="dot f"></i><span data-i18n="fat"></span><input id="gf" type="number" min="0" max="300" step="1"><small data-i18n="g"></small></label>
        <div class="goalbar"><span id="gsplit" class="muted"></span><button type="button" class="ghost" id="greset" data-i18n="reset_goals"></button></div>
      </div>
    </div>
    <ul class="facts" id="facts"></ul>
    <p class="note" data-i18n="disclaimer"></p>
  </div>

  <div class="card" id="plan">
    <div class="rowhead">
      <h2 data-i18n="plan_h"></h2>
      <button id="shuffle" class="ghost" data-i18n="new_plan"></button>
    </div>
    <div class="tabs" id="days"></div>
    <div id="daytotals" class="daytotals"></div>
    <div id="meals" class="meals"></div>
  </div>
</section>

<section id="recipes" class="card">
  <h2><span data-i18n="recipes_h"></span> <span id="rcount" class="muted"></span></h2>
  <div class="filters">
    <input id="q" type="search" data-i18n-ph="search_ph">
    <select id="fmeal"><option value="" data-i18n="all_meals"></option><option value="breakfast" data-i18n="breakfast"></option><option value="lunch" data-i18n="lunch"></option><option value="dinner" data-i18n="dinner"></option><option value="snack" data-i18n="snack"></option></select>
    <select id="fcuisine"></select>
    <select id="fpref"><option value="" data-i18n="pref_all"></option><option value="liked" data-i18n="pref_liked"></option><option value="hide" data-i18n="pref_hide"></option></select>
    <select id="fdiet"><option value="any" data-i18n="any_diet"></option><option value="veg" data-i18n="diet_veg"></option><option value="vegan" data-i18n="diet_vegan"></option></select>
  </div>
  <div id="rlist" class="rlist"></div>
  <div id="rmore" class="morerow"></div>
</section>
</main>

<footer><p data-i18n="footer"></p></footer>

<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <button class="close" id="mclose" aria-label="Close">×</button>
    <div id="mbody"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="data2.js"></script>
<script src="data3.js"></script>
<script src="ar.js"></script>
<script src="gen.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
